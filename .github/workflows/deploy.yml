name: Deploy to VM

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # La VM (e2-micro, 1 GB) comparte memoria con iadv-api y `nest build` se
      # queda sin RAM ahí. Se compila en el runner y a la VM solo viaja `dist`.
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Build
        run: |
          pnpm install --frozen-lockfile
          pnpm prisma generate
          pnpm build
          tar -czf dist.tgz dist

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add VM to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload dist
        run: scp dist.tgz ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/simonfc-dist.tgz

      - name: Deploy
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} GIT_SHA=${{ github.sha }} bash <<'EOF'
            set -euo pipefail

            # pnpm se instala en ~/.local/share/pnpm pero solo se carga en
            # shells interactivos via ~/.bashrc. GitHub Actions usa un shell
            # no-interactivo, por eso exportamos PATH manualmente.
            export PNPM_HOME="$HOME/.local/share/pnpm"
            export PATH="$PNPM_HOME/bin:/usr/local/bin:/usr/bin:/bin"

            cd ~/simonfc-api

            echo "==> Pulling $GIT_SHA..."
            git fetch --prune origin main
            git reset --hard "$GIT_SHA"

            echo "==> Installing dependencies..."
            pnpm install --frozen-lockfile

            echo "==> Generating Prisma client..."
            pnpm prisma generate

            echo "==> Replacing dist (compilado en el runner)..."
            rm -rf dist.new && mkdir dist.new
            tar -xzf /tmp/simonfc-dist.tgz -C dist.new --strip-components=1
            rm -rf dist && mv dist.new dist && rm -f /tmp/simonfc-dist.tgz

            echo "==> Restarting service..."
            sudo /usr/bin/systemctl restart simonfc-api
            sleep 3
            sudo /usr/bin/systemctl status simonfc-api --no-pager | head -10
          EOF

      - name: Health check
        run: |
          for i in {1..10}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://api-fc.institutoarboldevida.com/api/docs-json)
            if [ "$code" = "200" ]; then
              echo "✅ API responding (HTTP $code)"
              exit 0
            fi
            echo "Attempt $i: HTTP $code, retrying in 3s..."
            sleep 3
          done
          echo "❌ API did not return 200 after 30s"
          exit 1
